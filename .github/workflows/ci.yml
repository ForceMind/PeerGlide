name: Rust CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --workspace --locked
      - run: python tools/smoke.py
      - run: python tools/third_party.py
      - name: GUI runtime smoke on isolated Linux display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick
          xvfb-run -a python tools/gui_smoke.py
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: peerglide-prototype-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
